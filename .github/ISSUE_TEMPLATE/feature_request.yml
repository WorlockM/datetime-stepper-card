name: Feature request
description: Suggest a new option or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do
      description: Describe what you are trying to do and what is missing or awkward today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How should it work? A YAML example of the option you have in mind helps.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you tried or considered.
    validations:
      required: false
