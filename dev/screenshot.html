<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Screenshot</title>
    <!-- Renders one card for README screenshots: ?layout=row|card&theme=dark|light -->
    <style>
      :root {
        --primary-color: #03a9f4;
        --state-icon-color: #44739e;
        --error-color: #db4437;
      }
      .dark {
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --secondary-background-color: #282828;
        --divider-color: rgba(225, 225, 225, 0.12);
        --card-background-color: #1c1c1c;
        --page-bg: #111111;
      }
      .light {
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --secondary-background-color: #ececec;
        --divider-color: rgba(0, 0, 0, 0.12);
        --card-background-color: #ffffff;
        --page-bg: #f3f3f3;
      }
      html,
      body {
        margin: 0;
        background: var(--page-bg);
        font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #wrap {
        padding: 16px;
        width: 480px;
      }
      ha-card {
        display: block;
        background: var(--card-background-color);
        border: 1px solid var(--divider-color);
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div id="wrap"></div>
    <script>
      const params = new URLSearchParams(location.search);
      document.documentElement.className = params.get("theme") || "dark";
      if (params.get("width")) document.getElementById("wrap").style.width = params.get("width") + "px";
      customElements.define(
        "ha-card",
        class extends HTMLElement {
          connectedCallback() {
            // Page styles do not reach into the card's shadow DOM, so style the stub inline.
            this.style.cssText =
              "display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:12px";
          }
        },
      );
      customElements.define(
        "ha-state-icon",
        class extends HTMLElement {
          connectedCallback() {
            // mdi:calendar-clock
            this.innerHTML =
              '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M15,13H16.5V15.82L18.94,17.23L18.19,18.53L15,16.69V13M19,8H5V19H9.67C9.24,18.09 9,17.07 9,16A7,7 0 0,1 16,9C17.07,9 18.09,9.24 19,9.67V8M5,21C3.89,21 3,20.1 3,19V5C3,3.89 3.89,3 5,3H6V1H8V3H16V1H18V3H19A2,2 0 0,1 21,5V11.1C22.24,12.36 23,14.09 23,16A7,7 0 0,1 16,23C14.09,23 12.36,22.24 11.1,21H5M16,11.15A4.85,4.85 0 0,0 11.15,16C11.15,18.68 13.32,20.85 16,20.85A4.85,4.85 0 0,0 20.85,16C20.85,13.32 18.68,11.15 16,11.15Z"/></svg>';
          }
        },
      );
      // Tomorrow 08:00 local time, so the "in … h" hint looks realistic.
      const t = new Date();
      t.setDate(t.getDate() + 1);
      t.setHours(8, 0, 0, 0);
      const pad = (n) => String(n).padStart(2, "0");
      const state = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())} 08:00:00`;
      window.hass = {
        states: {
          "input_datetime.car_ready_by": {
            entity_id: "input_datetime.car_ready_by",
            state,
            attributes: { friendly_name: "Ready by", has_date: true, has_time: true },
          },
        },
        config: { time_zone: Intl.DateTimeFormat().resolvedOptions().timeZone },
        locale: { language: params.get("lang") || "en", time_format: "24", time_zone: "local" },
        callService: async () => {},
      };
    </script>
    <script src="./datetime-stepper-card.iife.js"></script>
    <script>
      const layout = params.get("layout") || "card";
      const el = document.createElement("datetime-stepper-card");
      el.setConfig({
        type: "custom:datetime-stepper-card",
        entity: "input_datetime.car_ready_by",
        layout,
        ...(params.get("date_format") ? { date_format: params.get("date_format") } : {}),
        ...(params.get("language") ? { language: params.get("language") } : {}),
        ...(params.get("name") ? { name: params.get("name"), icon: "mdi:car-clock" } : {}),
        ...(layout === "card" || params.get("quick") ? { quick_buttons: ["today", "tomorrow"] } : {}),
      });
      el.hass = window.hass;
      document.getElementById("wrap").append(el);
    </script>
  </body>
</html>
